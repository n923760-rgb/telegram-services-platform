name: Verify architecture and behavior
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: services
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: services_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U services -d services_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://services:test-only-password@localhost:5432/services_test
      REDIS_URL: redis://localhost:6379/0
      BOT_TOKEN: '123456:TEST_TOKEN_ONLY'
      AI_ENABLED: 'false'
      STORAGE_ROOT: ./data/test-files
    steps:
      # Pin the verified v7 tags to immutable commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.19
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
      - run: uv run alembic check
      - name: Validate Compose with example configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env.example config --quiet
