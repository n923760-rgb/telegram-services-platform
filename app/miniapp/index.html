<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>الخدمات الرقمية</title>
    <link rel="stylesheet" href="/miniapp/styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script defer src="/miniapp/intake.js"></script>
    <script defer src="/miniapp/app.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div>
          <p class="eyebrow" id="eyebrow">خدماتك الرقمية</p>
          <h1 id="heading">ماذا تريد أن تنجز؟</h1>
          <p id="subtitle" class="muted">
            اختر الخدمة المناسبة، وابدأ بخطوة بسيطة.
          </p>
        </div>
        <button
          class="lang"
          id="lang"
          type="button"
          aria-label="Switch language"
        >
          EN
        </button>
      </header>
      <div id="notice" role="status" aria-live="polite" class="notice">
        جارٍ تحميل الخدمات...
      </div>
      <main id="screen"></main>
      <nav id="tabs" class="tabs" aria-label="التنقل">
        <button
          type="button"
          data-tab="services"
          class="active"
          aria-current="page"
        >
          الخدمات
        </button>
        <button type="button" data-tab="orders">طلباتي</button>
        <button type="button" data-tab="account">حسابي</button>
      </nav>
    </div>
  </body>
</html>
