# Disposable dependencies only. Keep these separate from production volumes.
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: services
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: services_test
    ports: ['127.0.0.1:55432:5432']
    healthcheck:
      test: [CMD, pg_isready, -U, services, -d, services_test]
      interval: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:56379:6379']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      retries: 20
