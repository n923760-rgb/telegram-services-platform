[project]
name = "telegram-services"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
 "fastapi>=0.115,<1",
 "uvicorn>=0.30,<1",
 "aiogram>=3.15,<4",
 "SQLAlchemy[asyncio]>=2.0,<2.2",
 "asyncpg>=0.30,<1",
 "alembic>=1.14,<2",
 "redis>=5,<6",
 "arq>=0.26,<0.29",
 "pydantic>=2.10,<3",
 "pydantic-settings>=2.6,<3",
 "httpx>=0.27,<1",
 "python-docx>=1.1,<2",
 "openpyxl>=3.1,<4",
 "python-pptx>=1.0,<2",
 "reportlab>=4.2,<5",
 "pillow>=11,<13",
 "arabic-reshaper>=3,<4",
 "python-bidi>=0.6,<1",
 "pypdf>=6,<7",
 "docxtpl>=0.20,<0.21",
 "camelot-py==2.0.0",
 "numpy==2.5.3",
 "opencv-python-headless==5.0.0.93",
 "pypdfium2==5.13.0",
 "rapidfuzz==3.14.6",
]
[dependency-groups]
dev = ["ruff>=0.9,<1", "pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pdfplumber>=0.11,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "app/services"]
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
